<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Cota Waitlist — Admin</title>
    <link rel="icon" href="./assets/images/cota-icon-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./assets/images/cota-icon-dark.png" media="(prefers-color-scheme: dark)">
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f7fb;
        --muted: rgba(248, 247, 251, 0.72);
        --line: rgba(248, 247, 251, 0.18);
        --accent: #38a7ff;
        --accent-strong: #0a84ff;
        --rose: #ffb3bd;
        --field: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background: #050508;
        color: var(--ink);
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
      }

      .subtitle {
        margin: 0 0 32px;
        color: var(--muted);
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(18px);
        padding: 24px;
      }

      #login-section {
        max-width: 400px;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
      }

      input {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 14px;
        padding: 0 14px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      input:focus {
        box-shadow: 0 0 0 3px rgba(56, 167, 255, 0.35);
      }

      button {
        margin-top: 20px;
        height: 46px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        color: white;
        font: inherit;
        font-weight: 800;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        cursor: pointer;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.1);
      }

      #login-error {
        margin-top: 10px;
        color: var(--rose);
        font-size: 0.86rem;
        font-weight: 700;
        min-height: 1.2em;
      }

      #dashboard-section[hidden],
      #login-section[hidden] {
        display: none;
      }

      .dashboard-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      .metric {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 1.8rem;
        font-weight: 900;
      }

      #dashboard-status {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
      }

      #dashboard-status[data-tone="error"] { color: var(--rose); }
      #dashboard-status[data-tone="success"] { color: #8fffcf; }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }

      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      th {
        color: var(--muted);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
      }

      .table-wrap {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cota Waitlist</h1>
      <p class="subtitle">Panel de administración. Requiere iniciar sesión con una cuenta de Firebase autorizada.</p>

      <section id="login-section" class="card">
        <form id="login-form">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Iniciar sesión</button>
        </form>
        <p id="login-error"></p>
      </section>

      <section id="dashboard-section" hidden>
        <div class="dashboard-header">
          <p id="dashboard-status" data-tone="neutral">Cargando registros...</p>
          <div>
            <button type="button" class="secondary" id="refresh-button">Actualizar</button>
            <button type="button" class="secondary" id="logout-button">Cerrar sesión</button>
          </div>
        </div>

        <div class="metrics">
          <div class="metric"><div class="metric-label">Total</div><div class="metric-value" id="metric-total">0</div></div>
          <div class="metric"><div class="metric-label">iOS</div><div class="metric-value" id="metric-ios">0</div></div>
          <div class="metric"><div class="metric-label">Web</div><div class="metric-value" id="metric-web">0</div></div>
          <div class="metric"><div class="metric-label">Android</div><div class="metric-value" id="metric-android">0</div></div>
          <div class="metric"><div class="metric-label">iOS beta</div><div class="metric-value" id="metric-ios-beta">0</div></div>
        </div>

        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Correo</th>
                <th>Plataformas</th>
                <th>Idioma</th>
                <th>Registrado</th>
              </tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./assets/js/admin.js"></script>
  </body>
</html>
