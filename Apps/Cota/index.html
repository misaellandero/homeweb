<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cota es la app para cuidar a tus mascotas en iOS, web y Android. Unete a la waitlist para enterarte de la beta." data-i18n-meta="description">
    <title>Cota Waitlist</title>
    <link rel="icon" href="./assets/images/cota-icon-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./assets/images/cota-icon-dark.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="./assets/images/cota-icon-light.png">
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-backdrop" aria-hidden="true"></div>

        <div class="hero-content">
          <div class="language-toggle" aria-label="Idioma" data-i18n-aria-label="languageLabel">
            <button type="button" data-language="es" aria-pressed="true">ES</button>
            <button type="button" data-language="en" aria-pressed="false">EN</button>
          </div>

          <picture class="brand-icon">
            <source srcset="./assets/images/cota-icon-dark.png" media="(prefers-color-scheme: dark)">
            <img src="./assets/images/cota-icon-light.png" alt="Cota app icon">
          </picture>
          <p class="eyebrow" data-i18n="eyebrow">Cota para iOS, web y Android</p>
          <h1 id="hero-title" data-i18n="heroTitle">Cuidado diario para tus mascotas, sin perder el ritmo.</h1>
          <p class="lede" data-i18n="lede">
            Registra paseos, agua, comida, pipi, popo, vacunas y recordatorios. Estamos preparando la beta.
          </p>

          <div class="platforms" aria-label="Plataformas" data-i18n-aria-label="platformsLabel">
            <span>iOS</span>
            <span>Web</span>
            <span>Android</span>
          </div>

          <form class="waitlist-form" id="waitlist-form">
            <fieldset class="platform-choice">
              <legend data-i18n="platformLegend">Quiero recibir noticias de</legend>
              <label>
                <input type="checkbox" name="platform" value="iOS">
                <span>iOS app</span>
              </label>
              <label>
                <input type="checkbox" name="platform" value="Web">
                <span>Web app</span>
              </label>
              <label>
                <input type="checkbox" name="platform" value="Android">
                <span>Android app</span>
              </label>
              <label>
                <input type="checkbox" name="platform" value="All" id="platform-all">
                <span data-i18n="allPlatforms">Todas</span>
              </label>
            </fieldset>

            <div class="form-row">
              <label class="sr-only" for="email" data-i18n="emailLabel">Correo electronico</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" data-i18n-placeholder="emailPlaceholder" required>
              <button type="submit" data-i18n="submitButton">Unirme a la waitlist</button>
            </div>
          </form>
          <p class="form-note" id="form-note" role="status" data-i18n="initialStatus">Te avisaremos cuando la beta esté lista para las plataformas que elijas.</p>
        </div>
      </section>
    </main>

    <script type="module" src="./assets/js/waitlist.js"></script>
  </body>
</html>
