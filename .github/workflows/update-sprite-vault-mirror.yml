name: Update Sprite Vault Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static mirror
        run: |
          python3 Tools/SpriteVaultMirror/generate_mirror.py \
            --output sprite-vault \
            --base-url "https://misaellandero.com/sprite-vault" \
            --download-images

      - name: Upload mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprite-vault-mirror
          path: sprite-vault

      - name: Commit mirror updates
        run: |
          if [ -z "$(git status --porcelain -- sprite-vault)" ]; then
            echo "Mirror is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sprite-vault
          git commit -m "Update Sprite Vault static mirror"
          git push
