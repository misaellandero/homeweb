<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klenny</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://misaellandero.com/Apps/Klenny/index.html">
  <!-- Short URL: misaellandero.com/klenny -> /Apps/Klenny/. Keeps ?query (utm_*, lang) and #hash.
       It also saves the outside referrer (e.g. reddit.com) for this tab, because a JS redirect
       would otherwise report this page as the referrer; klenny.js hands it to GoatCounter. -->
  <script>
    (function () {
      try {
        var ref = document.referrer;
        if (ref && ref.indexOf(location.origin) !== 0) sessionStorage.setItem('klenny-referrer', ref);
      } catch (e) {}
      location.replace('/Apps/Klenny/index.html' + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/Apps/Klenny/index.html">
</head>
<body>
  <p><a href="/Apps/Klenny/index.html">Klenny</a></p>
</body>
</html>
